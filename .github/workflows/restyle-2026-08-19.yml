name: One time page restyle
on:
  push:
    paths:
      - '.github/workflows/restyle-2026-08-19.yml'
permissions:
  contents: write
jobs:
  restyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finish blue palette cleanup
        shell: python
        run: |
          from pathlib import Path
          replacements = {
              '#4f765f':'#4b6f91',
              '#f1f7f3':'#eef4fa',
              '#53605d':'#53616d',
              '#f0f2ef':'#f0f3f7',
              '#597068':'#597084',
              '#7a8682':'#7a8792',
              '#718079':'#71808b',
              '#74807c':'#74808c',
              '#63706c':'#63717c',
              '#849094':'#84909f',
              'rgba(28,55,47,.045)':'rgba(31,72,110,.045)',
              'rgba(28,55,47,.075)':'rgba(31,72,110,.075)'
          }
          for path in ['index.html','clr-overlap-checker/index.html']:
              p=Path(path); s=p.read_text(encoding='utf-8')
              for old,new in replacements.items(): s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')
      - name: Commit palette cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html clr-overlap-checker/index.html
          git commit -m "Finish blue palette cleanup"
          git push
